site_name: mi-sabio-core
repo_url: https://github.com/lanquarden/mi-sabio-core
site_url: https://lanquarden.github.io/mi-sabio-core
site_description: This is a template repository for Python projects that use uv for their dependency management.
site_author: Lanquarden
edit_uri: edit/main/docs/
repo_name: lanquarden/mi-sabio-core
copyright: Maintained by <a href="https://lanquarden.com">lanquarden</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["misabio"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lanquarden/mi-sabio-core
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mi-sabio-core

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
